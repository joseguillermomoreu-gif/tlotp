name: Deploy — El Pergamino viaja a Gondor

on:
  push:
    branches: [master]
    paths:
      - 'prompts/**'
      - 'VERSION.md'
      - 'scripts/compile.sh'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-deploy:
    name: Compilar y desplegar TLOTP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: "!startsWith(github.head_ref, 'backmerge/')"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Compilar prompts
        run: bash scripts/compile.sh

      - name: Verificar compilacion
        run: bash scripts/verify-compile.sh

      - name: Deploy via rsync
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "mkdir -p /var/www/portfolio/public/tlotp/"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_deploy" \
            dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/portfolio/public/tlotp/

      - name: Health check
        run: |
          sleep 5
          for i in 1 2 3; do
            HTTP_CODE=$(curl -s -o /tmp/health.html -w '%{http_code}' \
              "https://josemoreupeso.es/tlotp/index.html" || true)
            if [ "$HTTP_CODE" = "200" ]; then
              break
            fi
            echo "Attempt $i: HTTP $HTTP_CODE — retrying in 5s..."
            sleep 5
          done
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Health check failed — HTTP $HTTP_CODE (expected 200)"
            exit 1
          fi
          if ! grep -q "TLOTP" /tmp/health.html; then
            echo "::error::Health check failed — response body does not contain 'TLOTP'"
            exit 1
          fi
          echo "Health check passed — HTTP 200 and body contains 'TLOTP'"

      # Post-deploy smoke test — verify every URL in scripts/smoke-urls.txt
      # responds HTTP 200. Catches deploys where the root serves fine but
      # épica indexes or main prompts are broken (see issues #422, #424).
      - name: Smoke test public URLs
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2
        with:
          args: >
            --verbose
            --no-progress
            --timeout 20
            --max-retries 3
            --retry-wait-time 5
            --accept 200
            --
            scripts/smoke-urls.txt
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
