name: 🌳 CI - Guardianes del Bosque

on:
  push:
    branches: [master]
    paths:
      - '**/*.md'
      - '.github/workflows/**'
  pull_request:
    branches: [master, develop]
    paths:
      - '**/*.md'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Validar Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: "!startsWith(github.head_ref, 'backmerge/')"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@07035fd053f7be764496c0f8d8f9f41f98305101 # v22.0.0
        with:
          globs: "**/*.md"
          config: ".markdownlint.json"

  check-internal-links:
    name: Verificar links internos (@prompts/)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: "!startsWith(github.head_ref, 'backmerge/')"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check @prompts/ references
        run: |
          failed=0
          while IFS= read -r file; do
            while IFS= read -r ref; do
              # Skip template placeholders like @prompts/[nombre]/...
              if echo "$ref" | grep -qP '\[|\]'; then
                continue
              fi
              path="${ref#@}"
              # Skip if the epic directory doesn't exist (documentation examples)
              epic_dir=$(echo "$path" | cut -d'/' -f1-2)
              if [ ! -d "$epic_dir" ]; then
                continue
              fi
              if [ ! -f "$path" ]; then
                echo "❌ Link roto en $file -> @$path"
                failed=1
              fi
            done < <(grep -oP '@prompts/[^\s\`\"]+' "$file" 2>/dev/null || true)
          done < <(find . -name "*.md" -not -path "./.git/*")
          if [ "$failed" -eq 1 ]; then
            echo "::error::Se encontraron links internos rotos"
            exit 1
          fi
          echo "✅ Todos los @prompts/ son válidos"

  check-external-links:
    name: Verificar links externos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: "!startsWith(github.head_ref, 'backmerge/')"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check external links
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2
        with:
          args: >
            --verbose
            --no-progress
            --timeout 20
            --max-retries 3
            --accept 429,502
            --exclude-loopback
            --exclude 'localhost'
            --exclude 'example\.com'
            '**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
