name: 🏹 Release - El Libro de Cuentas

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Crear GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extraer changelog del tag
        id: changelog
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          # Extraer sección del changelog de VERSION.md para este tag
          awk "/^### ${TAG}/,/^---/" prompts/VERSION.md | \
            grep -v '^---' | head -60 > /tmp/changelog.md
          if [ ! -s /tmp/changelog.md ]; then
            echo "Release ${TAG}" > /tmp/changelog.md
          fi
          cat /tmp/changelog.md

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TLOTP ${{ github.ref_name }}"
          body_path: /tmp/changelog.md
          draft: false
          prerelease: false
